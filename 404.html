<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページが見つかりません ― ドラムトレーナー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='20' rx='12' ry='6' fill='%23a4492b'/%3E%3Crect x='4' y='14' width='24' height='6' fill='%23a4492b'/%3E%3Cellipse cx='16' cy='14' rx='12' ry='5' fill='%23f6e4dc' stroke='%23a4492b' stroke-width='1.5'/%3E%3Cline x1='9' y1='3' x2='15' y2='13' stroke='%232b2620' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='25' y1='4' x2='18' y2='13' stroke='%232b2620' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4efe6; --paper: #fffdf8; --ink: #2b2620; --muted: #7a6f62; --line: #e2d9ca; --accent: #a4492b; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--ink);
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
.card { max-width: 480px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
.code { font-size: 48px; font-weight: 700; color: var(--accent); margin: 0; letter-spacing: .05em; }
h1 { font-size: 20px; margin: 8px 0 12px; }
p { color: var(--muted); line-height: 1.8; margin: 0 0 24px; }
a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; }
</style>
</head>
<body>
<main class="card">
  <img src="/img/chara/worried.svg?v=1" alt="" width="60" height="54" style="display:block;margin:0 auto 4px">
  <p class="code">404</p>
  <h1>このページは、譜面の外へ叩き出されてしまったようです。</h1>
  <p>お探しのページは見つかりませんでした。URLが変わったか、入力に誤りがあるかもしれません。</p>
  <a class="btn" href="/">ドラムトレーナーのトップへ →</a>
</main>
</body>
</html>
